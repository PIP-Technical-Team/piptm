[project]
name = "piptm-load-testing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "locust>=2.32,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
